name: Replace JETKIZ phone once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/replace-phone-once.yml'

permissions:
  contents: write

jobs:
  replace-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old JETKIZ phone numbers everywhere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('+7 708 681 06 93', '+7 708 513 9728'),
              ('+7 708 681 0693', '+7 708 513 9728'),
              ('+7 (708) 681-06-93', '+7 708 513 9728'),
              ('+7 771 267 2236', '+7 708 513 9728'),
              ('77086810693', '77085139728'),
              ('7086810693', '7085139728'),
              ('77712672236', '77085139728'),
              ('7712672236', '7085139728'),
          ]
          allowed = {'.ts', '.tsx', '.js', '.jsx', '.json', '.md', '.txt', '.yml', '.yaml', '.html', '.css', '.xml'}
          skip = {'.git', 'node_modules', '.next', '.sites-runtime', '.vinext'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if any(part in skip for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          for item in changed:
              print(item)
          if not changed:
              raise SystemExit('No phone occurrences were changed')
          PY

          if grep -RInE '708[^0-9]*681[^0-9]*06[^0-9]*93|7086810693|77086810693|771[^0-9]*267[^0-9]*22[^0-9]*36|7712672236|77712672236' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.vinext .; then
            echo 'Old JETKIZ phone number still exists in repository'
            exit 1
          fi

          grep -RInE '708[^0-9]*513[^0-9]*9728|7085139728|77085139728' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.vinext . | head -n 100

      - name: Commit replacement and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/replace-phone-once.yml
          git config user.name 'jetkizdigital-droid'
          git config user.email 'jetkizdigital@gmail.com'
          git add -A
          git commit -m 'replace site contact phone with +7 708 513 9728'
          git push origin HEAD:main
